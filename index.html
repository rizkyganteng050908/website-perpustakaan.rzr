<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi Perpustakaan - ASTOA Perpustakaan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            50: '#f0f4f8',
                            100: '#d9e2ec',
                            200: '#bcccdc',
                            300: '#9fb3c8',
                            400: '#829ab1',
                            500: '#627d98',
                            600: '#486581',
                            700: '#334e68',
                            800: '#243b53',
                            900: '#102a43',
                            950: '#0b1d3a'
                        },
                        brand: {
                            blue: '#1e3a8a',
                            accent: '#1d4ed8',
                            gold: '#f59e0b'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        @media print {
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            body {
                background: white;
                color: black;
            }
            .print-card {
                box-shadow: none !important;
                border: 1px solid #ddd !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- APP CONTAINER -->
    <div id="app" class="flex-1 flex flex-col"></div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- DATA DEFAULT INITIALIZATION ---
        const initialBuku = [
            { id: "BK-001", judul: "Pemrograman Web dengan Tailwind", pengarang: "Budi Raharjo", penerbit: "Informatika", tahun: 2023, kriteria: "Teknologi", stok: 5 },
            { id: "BK-002", judul: "Basis Data Relasional & SQL", pengarang: "Siti Aminah", penerbit: "Andi Offset", tahun: 2021, kriteria: "Komputer", stok: 3 },
            { id: "BK-003", judul: "Matematika Diskrit Lanjut", pengarang: "Dr. Rahmat Hidayat", penerbit: "Erlangga", tahun: 2020, kriteria: "Pendidikan", stok: 8 },
            { id: "BK-004", judul: "Algoritma dan Struktur Data", pengarang: "Eko Prasetyo", penerbit: "Informatika", tahun: 2022, kriteria: "Teknologi", stok: 2 },
            { id: "BK-005", judul: "Metodologi Penelitian", pengarang: "Prof. Sugiyono", penerbit: "Alfabeta", tahun: 2019, kriteria: "Umum", stok: 4 }
        ];

        const initialUsers = [
            { id: "ADMIN", nama: "Administrator Utama", role: "admin", username: "admin", pass: "123", email: "admin@astoa.sch.id", kelas: "-" },
            { id: "USR-001", nama: "Siti Nurhaliza", role: "siswa", username: "USR-001", pass: "123", email: "siti@siswa.astoa.sch.id", kelas: "XI RPL 1" },
            { id: "USR-002", nama: "Ahmad Fauzi", role: "siswa", username: "USR-002", pass: "123", email: "ahmad.fauzi@siswa.astoa.sch.id", kelas: "XII TKJ 2" },
            { id: "USR-003", nama: "Budi Santoso", role: "siswa", username: "USR-003", pass: "123", email: "budi.santoso@siswa.astoa.sch.id", kelas: "X MM 3" }
        ];

        const initialPeminjaman = [
            { id: "TRX-001", idUser: "USR-002", idBuku: "BK-001", tglPinjam: "2026-10-01", tglKembali: "2026-10-08", tglDikembalikan: null, denda: 0, status: "Dipinjam" },
            { id: "TRX-002", idUser: "USR-002", idBuku: "BK-002", tglPinjam: "2026-09-10", tglKembali: "2026-09-17", tglDikembalikan: null, denda: 33000, status: "Dipinjam" }, // Terlambat
            { id: "TRX-003", idUser: "USR-001", idBuku: "BK-003", tglPinjam: "2026-09-01", tglKembali: "2026-09-08", tglDikembalikan: "2026-09-07", denda: 0, status: "Selesai" }
        ];

        // --- LOCAL STORAGE HELPERS ---
        function getStorage(key, defaultVal) {
            const data = localStorage.getItem('astoa_' + key);
            return data ? JSON.parse(data) : defaultVal;
        }

        function setStorage(key, val) {
            localStorage.setItem('astoa_' + key, JSON.stringify(val));
        }

        // --- STATE MANAGEMENT ---
        let state = {
            currentUser: getStorage('currentUser', null),
            buku: getStorage('buku', initialBuku),
            users: getStorage('users', initialUsers),
            peminjaman: getStorage('peminjaman', initialPeminjaman),
            
            // UI States
            activeTab: 'peminjaman', // admin: peminjaman, pengembalian, buku, user, laporan | siswa: katalog, riwayat, profil
            loginError: '',
            katalogSearch: '',
            bukuSearch: '',
            userSearch: '',
            editBukuModal: null,
            editUserModal: null,
            modalOpen: false
        };

        function saveData() {
            setStorage('buku', state.buku);
            setStorage('users', state.users);
            setStorage('peminjaman', state.peminjaman);
            setStorage('currentUser', state.currentUser);
        }

        // Helper calculations
        function calculateDenda(tglKembali, tglDikembalikan = null) {
            const today = tglDikembalikan ? new Date(tglDikembalikan) : new Date();
            const target = new Date(tglKembali);
            today.setHours(0,0,0,0);
            target.setHours(0,0,0,0);

            if (today > target) {
                const diffTime = Math.abs(today - target);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                return diffDays * 1000; // Rp 1.000 / hari
            }
            return 0;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateStr).toLocaleDateString('id-ID', options);
        }

        // --- RENDER FUNCTIONS ---
        function render() {
            const app = document.getElementById('app');
            
            if (!state.currentUser) {
                app.innerHTML = renderLogin();
            } else if (state.currentUser.role === 'admin') {
                app.innerHTML = renderAdminLayout();
            } else {
                app.innerHTML = renderSiswaLayout();
            }

            lucide.createIcons();
            attachEvents();
        }

        // --- 1. LOGIN PAGE VIEW ---
        function renderLogin() {
            return `
            <div class="min-h-screen bg-gradient-to-br from-navy-950 via-navy-900 to-brand-blue flex flex-col justify-center items-center p-4">
                <!-- Branding Card -->
                <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-100 transition-all duration-300">
                    
                    <!-- Header Wireframe Style -->
                    <div class="bg-gradient-to-r from-navy-900 to-brand-blue p-8 text-center text-white relative">
                        <div class="inline-flex items-center justify-center w-20 h-20 bg-white/10 backdrop-blur-md rounded-2xl mb-3 border border-white/20 shadow-inner">
                            <i data-lucide="book-open-check" class="w-10 h-10 text-amber-400"></i>
                        </div>
                        <h1 class="text-2xl font-bold tracking-tight">ASTOA PERPUSTAKAAN</h1>
                        <p class="text-xs text-navy-200 mt-1 uppercase tracking-wider font-semibold">Sistem Informasi Perpustakaan Sekolah</p>
                    </div>

                    <!-- Form Login -->
                    <div class="p-8">
                        ${state.loginError ? `
                            <div class="mb-5 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-sm flex items-center gap-2 animate-bounce">
                                <i data-lucide="alert-circle" class="w-5 h-5 shrink-0 text-rose-600"></i>
                                <span>${state.loginError}</span>
                            </div>
                        ` : ''}

                        <form id="loginForm" class="space-y-5">
                            <div>
                                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Username / ID Anggota</label>
                                <div class="relative">
                                    <i data-lucide="user" class="w-5 h-5 absolute left-3.5 top-3.5 text-slate-400"></i>
                                    <input type="text" id="username" required autocomplete="off"
                                        placeholder="Masukkan ID / Username" 
                                        class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-accent focus:border-brand-accent outline-none text-slate-800 text-sm transition-all">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Kata Sandi / Password</label>
                                <div class="relative">
                                    <i data-lucide="lock" class="w-5 h-5 absolute left-3.5 top-3.5 text-slate-400"></i>
                                    <input type="password" id="password" required
                                        placeholder="••••••••" 
                                        class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-accent focus:border-brand-accent outline-none text-slate-800 text-sm transition-all">
                                </div>
                            </div>

                            <button type="submit" 
                                class="w-full py-3.5 bg-brand-blue hover:bg-navy-800 text-white font-semibold rounded-xl shadow-lg shadow-navy-900/20 active:scale-[0.99] transition-all flex items-center justify-center gap-2">
                                <i data-lucide="log-in" class="w-5 h-5"></i>
                                <span>MASUK KE SISTEM</span>
                            </button>
                        </form>

                        <!-- Quick Demo Section for Evaluators -->
                        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                            <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-3">Akses Cepat Penguji (Quick Login Demo)</span>
                            <div class="grid grid-cols-2 gap-2">
                                <button type="button" onclick="quickLogin('admin', '123')" 
                                    class="p-2.5 bg-slate-50 hover:bg-navy-50 border border-slate-200 rounded-xl text-xs font-medium text-slate-700 flex flex-col items-center gap-1 transition-all">
                                    <span class="px-2 py-0.5 bg-navy-900 text-white text-[10px] rounded-full font-bold">Admin</span>
                                    <span>admin / 123</span>
                                </button>
                                <button type="button" onclick="quickLogin('USR-002', '123')" 
                                    class="p-2.5 bg-slate-50 hover:bg-indigo-50 border border-slate-200 rounded-xl text-xs font-medium text-slate-700 flex flex-col items-center gap-1 transition-all">
                                    <span class="px-2 py-0.5 bg-indigo-600 text-white text-[10px] rounded-full font-bold">Siswa</span>
                                    <span>USR-002 / 123</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <p class="mt-6 text-xs text-navy-300 text-center font-medium">
                    &copy; 2026 ASTOA Perpustakaan — Sistem Manajemen Perpustakaan Digital
                </p>
            </div>
            `;
        }

        // --- 2. HEADER & NAVIGATION (COMMON) ---
        function renderHeader() {
            const isLogged = state.currentUser;
            return `
            <header class="bg-navy-900 text-white shadow-md sticky top-0 z-30 no-print">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div class="flex items-center justify-between h-16">
                        <!-- Brand/Logo -->
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-brand-accent rounded-xl flex items-center justify-center text-white shadow-md">
                                <i data-lucide="book-open" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <span class="text-lg font-bold tracking-tight block leading-tight">ASTOA PERPUSTAKAAN</span>
                                <span class="text-[10px] text-navy-300 uppercase tracking-widest block font-medium">Integrated Library System</span>
                            </div>
                        </div>

                        <!-- User Profile Status & Logout -->
                        ${isLogged ? `
                            <div class="flex items-center gap-4">
                                <div class="hidden sm:flex flex-col items-end">
                                    <span class="text-sm font-semibold">${isLogged.nama}</span>
                                    <span class="text-[11px] px-2 py-0.5 rounded-full ${isLogged.role === 'admin' ? 'bg-amber-500/20 text-amber-300' : 'bg-blue-500/20 text-blue-300'} font-medium uppercase tracking-wider">
                                        ${isLogged.role === 'admin' ? 'Administrator' : 'Siswa / Anggota'}
                                    </span>
                                </div>
                                <button onclick="logout()" 
                                    class="px-3 py-2 bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white border border-rose-500/30 rounded-xl text-xs font-semibold flex items-center gap-2 transition-all">
                                    <i data-lucide="log-out" class="w-4 h-4"></i>
                                    <span class="hidden md:inline">Keluar</span>
                                </button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            </header>
            `;
        }

        // --- 3. ADMIN DASHBOARD VIEW ---
        function renderAdminLayout() {
            return `
            ${renderHeader()}
            <div class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col md:flex-row gap-6">
                <!-- Sidebar Nav Admin -->
                <aside class="w-full md:w-64 bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4 h-fit no-print">
                    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider px-3 mb-2">Menu Utama</div>
                    <nav class="space-y-1">
                        <button onclick="setTab('peminjaman')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all ${state.activeTab === 'peminjaman' ? 'bg-navy-900 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}">
                            <i data-lucide="arrow-right-left" class="w-4 h-4"></i>
                            <span>Peminjaman Buku</span>
                        </button>
                        <button onclick="setTab('pengembalian')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all ${state.activeTab === 'pengembalian' ? 'bg-navy-900 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}">
                            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                            <span>Pengembalian & Denda</span>
                        </button>
                        <button onclick="setTab('buku')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all ${state.activeTab === 'buku' ? 'bg-navy-900 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}">
                            <i data-lucide="book-marked" class="w-4 h-4"></i>
                            <span>Master Buku</span>
                        </button>
                        <button onclick="setTab('user')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all ${state.activeTab === 'user' ? 'bg-navy-900 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}">
                            <i data-lucide="users" class="w-4 h-4"></i>
                            <span>Master Anggota</span>
                        </button>
                        <button onclick="setTab('laporan')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all ${state.activeTab === 'laporan' ? 'bg-navy-900 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}">
                            <i data-lucide="file-text" class="w-4 h-4"></i>
                            <span>Laporan & Cetak</span>
                        </button>
                    </nav>
                </aside>

                <!-- Content Area -->
                <main class="flex-1 min-w-0">
                    ${renderAdminTabContent()}
                </main>
            </div>
            `;
        }

        function renderAdminTabContent() {
            switch(state.activeTab) {
                case 'peminjaman': return renderAdminPeminjaman();
                case 'pengembalian': return renderAdminPengembalian();
                case 'buku': return renderAdminBuku();
                case 'user': return renderAdminUser();
                case 'laporan': return renderAdminLaporan();
                default: return renderAdminPeminjaman();
            }
        }

        // Peminjaman Tab
        function renderAdminPeminjaman() {
            const today = new Date().toISOString().split('T')[0];
            const nextWeek = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];

            return `
            <div class="space-y-6">
                <!-- Form Input Transaksi -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6">
                    <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                        <i data-lucide="plus-circle" class="w-5 h-5 text-brand-blue"></i>
                        Pencatatan Peminjaman Buku Baru
                    </h2>

                    <form id="peminjamanForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Anggota / Siswa</label>
                            <select id="pinjamUser" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-brand-accent">
                                <option value="">-- Pilih Anggota --</option>
                                ${state.users.filter(u => u.role === 'siswa').map(u => `
                                    <option value="${u.id}">${u.id} - ${u.nama} (${u.kelas})</option>
                                `).join('')}
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Buku</label>
                            <select id="pinjamBuku" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-brand-accent">
                                <option value="">-- Pilih Buku --</option>
                                ${state.buku.map(b => `
                                    <option value="${b.id}" ${b.stok <= 0 ? 'disabled' : ''}>${b.id} - ${b.judul} (Stok: ${b.stok})</option>
                                `).join('')}
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal Pinjam</label>
                            <input type="date" id="pinjamTgl" value="${today}" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-brand-accent">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal Jatuh Tempo (+7 Hari)</label>
                            <input type="date" id="pinjamTempo" value="${nextWeek}" required readonly class="w-full p-2.5 bg-slate-100 border border-slate-200 rounded-xl text-sm text-slate-500 outline-none">
                        </div>

                        <div class="md:col-span-2 pt-2">
                            <button type="submit" class="w-full md:w-auto px-6 py-2.5 bg-brand-blue hover:bg-navy-800 text-white text-sm font-semibold rounded-xl shadow-md transition-all flex items-center justify-center gap-2">
                                <i data-lucide="check" class="w-4 h-4"></i>
                                Simpan Transaksi Peminjaman
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Active Borrowing Table -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">
                    <div class="p-5 border-b border-slate-100 flex items-center justify-between">
                        <h3 class="font-bold text-slate-800">Daftar Peminjaman Aktif</h3>
                        <span class="text-xs bg-blue-50 text-brand-blue font-semibold px-2.5 py-1 rounded-lg">
                            Total: ${state.peminjaman.filter(p => p.status === 'Dipinjam').length} Aktif
                        </span>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs text-slate-600">
                            <thead class="bg-slate-50 text-slate-700 uppercase font-semibold">
                                <tr>
                                    <th class="p-3.5">ID Transaksi</th>
                                    <th class="p-3.5">Peminjam</th>
                                    <th class="p-3.5">Buku</th>
                                    <th class="p-3.5">Tgl Pinjam</th>
                                    <th class="p-3.5">Jatuh Tempo</th>
                                    <th class="p-3.5">Status / Denda Tentatif</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${state.peminjaman.filter(p => p.status === 'Dipinjam').map(p => {
                                    const user = state.users.find(u => u.id === p.idUser) || { nama: p.idUser };
                                    const buku = state.buku.find(b => b.id === p.idBuku) || { judul: p.idBuku };
                                    const denda = calculateDenda(p.tglKembali);
                                    return `
                                    <tr class="hover:bg-slate-50/80 transition-all">
                                        <td class="p-3.5 font-mono font-medium text-slate-900">${p.id}</td>
                                        <td class="p-3.5">
                                            <span class="font-semibold text-slate-800 block">${user.nama}</span>
                                            <span class="text-[10px] text-slate-400">${p.idUser}</span>
                                        </td>
                                        <td class="p-3.5">
                                            <span class="font-medium text-slate-800 block">${buku.judul}</span>
                                            <span class="text-[10px] text-slate-400">${p.idBuku}</span>
                                        </td>
                                        <td class="p-3.5">${formatDate(p.tglPinjam)}</td>
                                        <td class="p-3.5">${formatDate(p.tglKembali)}</td>
                                        <td class="p-3.5">
                                            ${denda > 0 ? `
                                                <span class="px-2 py-1 bg-rose-100 text-rose-700 rounded-lg font-bold text-[11px] inline-flex items-center gap-1">
                                                    <i data-lucide="alert-triangle" class="w-3 h-3"></i> Terlambat (Rp ${denda.toLocaleString()})
                                                </span>
                                            ` : `
                                                <span class="px-2 py-1 bg-emerald-100 text-emerald-700 rounded-lg font-semibold text-[11px]">
                                                    Lancar
                                                </span>
                                            `}
                                        </td>
                                    </tr>
                                    `;
                                }).join('') || '<tr><td colspan="6" class="p-6 text-center text-slate-400">Belum ada peminjaman aktif.</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            `;
        }

        // Pengembalian Tab
        function renderAdminPengembalian() {
            const dipinjamList = state.peminjaman.filter(p => p.status === 'Dipinjam');

            return `
            <div class="space-y-6">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6">
                    <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                        <i data-lucide="rotate-ccw" class="w-5 h-5 text-brand-blue"></i>
                        Proses Pengembalian Buku & Denda
                    </h2>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs text-slate-600">
                            <thead class="bg-slate-50 text-slate-700 uppercase font-semibold">
                                <tr>
                                    <th class="p-3.5">ID</th>
                                    <th class="p-3.5">Anggota</th>
                                    <th class="p-3.5">Buku</th>
                                    <th class="p-3.5">Jatuh Tempo</th>

        // --- ACTION HANDLERS ---
        function setTab(tab) {
            state.activeTab = tab;
            render();

        function quickLogin(username, pass) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = pass;
            handleLogin(username, pass);
        }

        function handleLogin(usr, pwd) {
            const user = state.users.find(u => (u.username === usr || u.id === usr) && u.pass === pwd);
            if (user) {
                state.currentUser = user;
                state.loginError = '';
                state.activeTab = user.role === 'admin' ? 'peminjaman' : 'katalog';
                saveData();
                render();
            } else {
                state.loginError = 'Username atau Password salah! Silakan coba lagi.';
                render();
            }
        }

        function logout() {
            state.currentUser = null;
            state.loginError = '';
            saveData();
            render();
        }

        function prosesPengembalian(idTrx) {
            const trx = state.peminjaman.find(p => p.id === idTrx);
            if (!trx) return;

            const nowStr = new Date().toISOString().split('T')[0];
            const finalDenda = calculateDenda(trx.tglKembali, nowStr);

            trx.status = 'Selesai';
            trx.tglDikembalikan = nowStr;
            trx.denda = finalDenda;

            // Restock book
            const buku = state.buku.find(b => b.id === trx.idBuku);
            if (buku) buku.stok += 1;

            saveData();
            render();
        }

        function deleteBuku(idBuku) {
            state.buku = state.buku.filter(b => b.id !== idBuku);
            saveData();
            render();
        }

        function deleteUser(idUser) {
            state.users = state.users.filter(u => u.id !== idUser);
            saveData();
            render();
        }

        // --- EVENT ATTACHMENT ---
        function attachEvents() {
            // Login Form Event
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const usr = document.getElementById('username').value.trim();
                    const pwd = document.getElementById('password').value.trim();
                    handleLogin(usr, pwd);
                });
            }

            // Peminjaman Form Event
            const peminjamanForm = document.getElementById('peminjamanForm');
            if (peminjamanForm) {
                peminjamanForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const idUser = document.getElementById('pinjamUser').value;
                    const idBuku = document.getElementById('pinjamBuku').value;
                    const tglPinjam = document.getElementById('pinjamTgl').value;
                    const tglKembali = document.getElementById('pinjamTempo').value;

                    const buku = state.buku.find(b => b.id === idBuku);
                    if (!buku || buku.stok <= 0) {
                        alert('Stok buku tidak tersedia!');
                        return;
                    }

                    buku.stok -= 1;
                    const newTrx = {
                        id: 'TRX-' + String(state.peminjaman.length + 1).padStart(3, '0'),
                        idUser,
                        idBuku,
                        tglPinjam,
                        tglKembali,
                        tglDikembalikan: null,
                        denda: 0,
                        status: 'Dipinjam'
                    };

                    state.peminjaman.push(newTrx);
                    saveData();
                    render();
                });
            }

            // Search Inputs Dynamic Binding
            const katalogSearchInput = document.getElementById('katalogSearchInput');
            if (katalogSearchInput) {
                katalogSearchInput.addEventListener('input', (e) => {
                    state.katalogSearch = e.target.value;
                    render();
                });
            }

            const bukuSearchInput = document.getElementById('bukuSearchInput');
            if (bukuSearchInput) {
                bukuSearchInput.addEventListener('input', (e) => {
                    state.bukuSearch = e.target.value;
                    render();
                });
            }

            // Add Buku Form Event
            const addBukuForm = document.getElementById('addBukuForm');
            if (addBukuForm) {
                addBukuForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const newBuku = {
                        id: 'BK-' + String(state.buku.length + 1).padStart(3, '0'),
                        judul: document.getElementById('addJudul').value,
                        pengarang: document.getElementById('addPengarang').value,
                        penerbit: document.getElementById('addPenerbit').value,
                        tahun: parseInt(document.getElementById('addTahun').value),
                        kriteria: document.getElementById('addKriteria').value,
                        stok: parseInt(document.getElementById('addStok').value)
                    };
                    state.buku.push(newBuku);
                    saveData();
                    render();
                });
            }

            // Add User Form Event
            const addUserForm = document.getElementById('addUserForm');
            if (addUserForm) {
                addUserForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const id = document.getElementById('addUserId').value.toUpperCase();
                    const newUser = {
                        id,
                        nama: document.getElementById('addUserName').value,
                        kelas: document.getElementById('addUserClass').value || '-',
                        username: document.getElementById('addUserUsername').value,
                        pass: document.getElementById('addUserPass').value,
                        role: document.getElementById('addUserRole').value,
                        email: `${id.toLowerCase()}@astoa.sch.id`
                    };
                    state.users.push(newUser);
                    saveData();
                    render();
                });
            }
        }

        // --- INIT APP ON LOAD ---
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
